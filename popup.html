<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Account Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h2><span data-i18n="nav.title"></span> <span id="accountCount" class="account-count"></span></h2>
            <div class="header-actions">
                <button id="settingsBtn" class="icon-btn" data-i18n-title="settings.title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 00.12-.65l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.027 7.027 0 00-1.63-.94l-.36-2.54A.5.5 0 0014.5 2h-5a.5.5 0 00-.5.43l-.36 2.54c-.58.22-1.12.52-1.63.94l-2.39-.96a.5.5 0 00-.61.22L2.71 8.87a.5.5 0 00.12.65l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 00-.12.65l1.92 3.32c.14.24.43.34.69.22l2.39-.96c.51.42 1.05.72 1.63.94l.36 2.54c.05.28.28.43.5.43h5c.22 0 .45-.15.5-.43l.36-2.54c.58-.22 1.12-.52 1.63-.94l2.39.96c.26.11.55.02.69-.22l1.92-3.32a.5.5 0 00-.12-.65l-2.03-1.58zM12 15.5A3.5 3.5 0 1115.5 12 3.5 3.5 0 0112 15.5z"></path>
                    </svg>
                </button>
                <button id="addFolderBtn" class="icon-btn" data-i18n-title="folder.newFolder">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20 6H12L10 4H4C2.89 4 2.01 4.89 2.01 6L2 18C2 19.11 2.89 20 4 20H20C21.11 20 22 19.11 22 18V8C22 6.89 21.11 6 20 6ZM20 18H4V8H20V18ZM19 13H15V17H13V13H9V11H13V7H15V11H19V13Z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <div id="progressBarContainer" class="progress-bar-container" style="display: none;">
            <div class="progress-info">
                <span id="progressText" class="progress-text" data-i18n="settings.checking"></span>
                <span id="progressCount" class="progress-count">0/0</span>
            </div>
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21.707 20.293L16.056 14.642C17.263 13.111 18 11.141 18 9C18 4.037 13.963 0 9 0C4.037 0 0 4.037 0 9C0 13.963 4.037 18 9 18C11.141 18 13.111 17.263 14.642 16.056L20.293 21.707C20.488 21.902 20.744 22 21 22C21.256 22 21.512 21.902 21.707 21.707C22.098 21.316 22.098 20.684 21.707 20.293ZM9 16C5.14 16 2 12.86 2 9C2 5.14 5.14 2 9 2C12.86 2 16 5.14 16 9C16 12.86 12.86 16 9 16Z"></path>
                </svg>
                <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder">
                <button id="clearSearchBtn" class="clear-search-btn" data-i18n-title="search.clear">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.41 5.41L17 4L12 9L7 4L5.59 5.41L10.59 10.41L5.59 15.41L7 16.82L12 11.82L17 16.82L18.41 15.41L13.41 10.41L18.41 5.41Z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="account-list" id="accountList">
        </div>

        <div class="add-token-form" id="addTokenForm" style="display: none;">
            <div class="add-token-header">
                <div class="add-token-title-row">
                    <span class="add-token-title" data-i18n="actions.addToken"></span>
                    <span id="detectedTokensBadge" class="detected-tokens-badge" style="display: none;"></span>
                </div>
                <label class="btn-upload-txt" data-i18n-title="addToken.importTxtTitle">
                    <input type="file" id="importTxtFile" accept=".txt" style="display: none;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/>
                    </svg>
                    <span data-i18n="addToken.importTxt"></span>
                </label>
            </div>

            <textarea id="tokenInput" rows="3" data-i18n-placeholder="addToken.multiPlaceholder"></textarea>

            <div class="token-folder-row" id="tokenFolderRow">
                <label class="token-folder-label" data-i18n="addToken.targetFolder"></label>
                <div class="custom-select-container token-folder-custom-select" id="customTokenFolderSelect">
                    <button class="custom-select-trigger token-folder-trigger" type="button" id="tokenFolderTrigger">
                        <svg class="folder-select-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                        </svg>
                        <span class="custom-select-text" id="tokenFolderTriggerText" data-i18n="addToken.noFolder"></span>
                        <svg class="custom-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                    <div class="token-folder-options" id="tokenFolderOptions"></div>
                    <select id="tokenFolderSelect" style="display: none;">
                        <option value="" data-i18n="addToken.noFolder"></option>
                    </select>
                </div>
            </div>

            <div id="addTokenProgressContainer" class="add-token-progress-container" style="display: none;">
                <div class="progress-info">
                    <span id="addTokenProgressText" class="progress-text"></span>
                    <span id="addTokenProgressCount" class="progress-count"></span>
                </div>
                <div class="progress-bar-bg">
                    <div id="addTokenProgressBar" class="progress-bar"></div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-cancel" id="cancelAddBtn" data-i18n="addToken.cancel"></button>
                <button class="btn btn-primary" id="saveTokenBtn" data-i18n="addToken.save"></button>
            </div>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <div class="footer-actions" id="footerActions">
            <button class="btn btn-primary" id="addCurrentAccountBtn" disabled data-i18n-title="actions.addCurrentTooltip" data-i18n="actions.addCurrent"></button>
            <button class="btn btn-primary" id="showAddBtn" data-i18n="actions.addToken"></button>
            <button class="btn btn-danger" id="deleteAllBtn" data-i18n-title="actions.deleteAll">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15 3.999V2H9V3.999H3V5.999H21V3.999H15Z"></path>
                    <path
                        d="M5 6.99902V18.999C5 20.101 5.897 20.999 7 20.999H17C18.103 20.999 19 20.101 19 18.999V6.99902H5ZM11 17H9V11H11V17ZM15 17H13V11H15V17Z">
                    </path>
                </svg>
            </button>
        </div>
    </div>

    <div id="settingsModal" class="settings-page" style="display: none;">
        <div class="settings-header">
            <button id="closeSettingsBtn" class="icon-btn back-btn" data-i18n-title="nav.back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
                </svg>
            </button>
            <div class="settings-title">
                <h2 data-i18n="settings.title"></h2>
            </div>
            <div class="header-spacer" style="width: 32px;"></div>
        </div>
        <div class="settings-content">
            <div class="settings-card">
                <div class="settings-card-header">
                    <span class="settings-card-title" data-i18n="settings.tokenHealth"></span>
                </div>
                <button id="checkAllTokensBtn" class="settings-action-btn" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <span data-i18n="settings.checkAll"></span>
                </button>
                <button id="cancelCheckBtn" class="settings-action-btn settings-cancel-btn" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
                    </svg>
                    <span data-i18n="settings.cancelCheck"></span>
                </button>
                <div id="settingsStatusContainer" class="settings-status-container">
                    <div id="settingsStatusText" class="settings-status-text" data-i18n="settings.lastCheckUnavailable"></div>
                    <div id="settingsLastSummary" class="settings-last-summary"></div>
                </div>
                <div id="settingsProgressBarContainer" class="progress-bar-container settings-progress" style="display: none;">
                    <div class="progress-info">
                        <span id="settingsProgressText" class="progress-text" data-i18n="settings.checking"></span>
                        <span id="settingsProgressCount" class="progress-count">0/0</span>
                    </div>
                    <div id="settingsProgressBar" class="progress-bar"></div>
                </div>
                <div id="invalidAccountsListContainer" class="invalid-accounts-section" style="display: none;"></div>
            </div>

            <div class="settings-card">
                <div class="settings-action-item">
                    <div class="settings-label-group">
                        <label for="themeSelect" class="settings-label" data-i18n="settings.appearanceTheme"></label>
                        <span class="settings-sublabel" data-i18n="settings.themeSub"></span>
                    </div>
                    <div class="custom-select-container" id="customThemeSelect">
                        <button class="custom-select-trigger" type="button">
                            <span class="theme-badge-dot discord-dark"></span>
                            <span class="custom-select-text" data-i18n="theme.discordDark"></span>
                            <svg class="custom-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M7 10l5 5 5-5z"/>
                            </svg>
                        </button>
                        <div class="custom-select-options">
                            <div class="custom-option selected" data-value="discord-dark">
                                <span class="theme-badge-dot discord-dark"></span>
                                <span class="option-label" data-i18n="theme.discordDark"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="amoled">
                                <span class="theme-badge-dot amoled"></span>
                                <span class="option-label" data-i18n="theme.amoled"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="light">
                                <span class="theme-badge-dot light"></span>
                                <span class="option-label" data-i18n="theme.light"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="midnight-blurple">
                                <span class="theme-badge-dot midnight-blurple"></span>
                                <span class="option-label" data-i18n="theme.midnightBlurple"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="retro-storm">
                                <span class="theme-badge-dot retro-storm"></span>
                                <span class="option-label" data-i18n="theme.retroStorm"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="neon-nights">
                                <span class="theme-badge-dot neon-nights"></span>
                                <span class="option-label" data-i18n="theme.neonNights"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="sunset">
                                <span class="theme-badge-dot sunset"></span>
                                <span class="option-label" data-i18n="theme.sunset"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="mint-apple">
                                <span class="theme-badge-dot mint-apple"></span>
                                <span class="option-label" data-i18n="theme.mintApple"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="hanami">
                                <span class="theme-badge-dot hanami"></span>
                                <span class="option-label" data-i18n="theme.hanami"></span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <select id="themeSelect" style="display: none;">
                        <option value="discord-dark" data-i18n="theme.discordDark"></option>
                        <option value="amoled" data-i18n="theme.amoled"></option>
                        <option value="light" data-i18n="theme.light"></option>
                        <option value="midnight-blurple" data-i18n="theme.midnightBlurple"></option>
                        <option value="retro-storm" data-i18n="theme.retroStorm"></option>
                        <option value="neon-nights" data-i18n="theme.neonNights"></option>
                        <option value="sunset" data-i18n="theme.sunset"></option>
                        <option value="mint-apple" data-i18n="theme.mintApple"></option>
                        <option value="hanami" data-i18n="theme.hanami"></option>
                    </select>
                </div>
            </div>

            <div class="settings-card">
                <div class="settings-toggle-item">
                    <div class="settings-label-group">
                        <label for="showBadgesToggle" class="settings-label" data-i18n="settings.showBadges"></label>
                        <span class="settings-sublabel" data-i18n="settings.showBadgesSub"></span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="showBadgesToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-card">
                <div class="settings-action-item">
                    <div class="settings-label-group">
                        <label for="langSelect" class="settings-label" data-i18n="settings.language"></label>
                        <span class="settings-sublabel" data-i18n="settings.languageSub"></span>
                    </div>
                    <div class="custom-select-container" id="customLangSelect">
                        <button class="custom-select-trigger" type="button">
                            <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><path fill="#bd3d44" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 36.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0z"/><path fill="#192f5d" d="M0 0h280v258.5H0z"/></svg></span>
                            <span class="custom-select-text">English</span>
                            <svg class="custom-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M7 10l5 5 5-5z"/>
                            </svg>
                        </button>
                        <div class="custom-select-options">
                            <div class="custom-option selected" data-value="en">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><path fill="#bd3d44" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 36.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0zm0 73.9h640v36.9H0zm0 73.8h640v36.9H0z"/><path fill="#192f5d" d="M0 0h280v258.5H0z"/></svg></span>
                                <span class="option-label">English</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="tr">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="640" height="480" fill="#E30A17"/><circle cx="230" cy="240" r="140" fill="#ffffff"/><circle cx="265" cy="240" r="112" fill="#E30A17"/><path d="M342.3 216.7l15.6 48-40.8-29.6-40.8 29.6 15.6-48-40.8-29.7h50.4l15.6-48 15.6 48h50.4z" fill="#ffffff"/></svg></span>
                                <span class="option-label">Türkçe</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="de">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="640" height="160" y="0" fill="#000000"/><rect width="640" height="160" y="160" fill="#DD0000"/><rect width="640" height="160" y="320" fill="#FFCC00"/></svg></span>
                                <span class="option-label">Deutsch</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="es">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="640" height="120" y="0" fill="#AA151B"/><rect width="640" height="240" y="120" fill="#F1BF00"/><rect width="640" height="120" y="360" fill="#AA151B"/></svg></span>
                                <span class="option-label">Español</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="fr">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="213.3" height="480" x="0" fill="#002395"/><rect width="213.3" height="480" x="213.3" fill="#ffffff"/><rect width="213.3" height="480" x="426.6" fill="#ED2939"/></svg></span>
                                <span class="option-label">Français</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="pt">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="256" height="480" fill="#046A38"/><rect width="384" height="480" x="256" fill="#DA291C"/><circle cx="256" cy="240" r="90" fill="#FFC72C"/><circle cx="256" cy="240" r="75" fill="#DA291C"/></svg></span>
                                <span class="option-label">Português</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="ru">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="640" height="160" y="0" fill="#ffffff"/><rect width="640" height="160" y="160" fill="#0039A6"/><rect width="640" height="160" y="320" fill="#D52B1E"/></svg></span>
                                <span class="option-label">Русский</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="it">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="213.3" height="480" fill="#009246"/><rect width="213.3" height="480" x="213.3" fill="#ffffff"/><rect width="213.3" height="480" x="426.6" fill="#ce2b37"/></svg></span>
                                <span class="option-label">Italiano</span>
                                <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </div>
                            <div class="custom-option" data-value="ja">
                                <span class="lang-flag"><svg class="flag-icon" width="18" height="13" viewBox="0 0 640 480"><rect width="640" height="480" fill="#ffffff"/><circle cx="320" cy="240" r="144" fill="#bc002d"/></svg></span>
